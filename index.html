<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nạp thẻ Garena</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 400px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e52b2b;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #e52b2b;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e52b2b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c91f1f;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">GARENA</div>

    <div class="subtitle">
      Nạp thẻ game - Demo
    </div>

    <label>Tài khoản / ID nhân vật</label>
    <input
      type="text"
      id="userId"
      placeholder="Nhập ID của bạn"
    >

    <label>Chọn mệnh giá</label>

    <select id="amount">
      <option value="">-- Chọn mệnh giá --</option>
      <option value="10000">10.000 VNĐ</option>
      <option value="20000">20.000 VNĐ</option>
      <option value="50000">50.000 VNĐ</option>
      <option value="100000">100.000 VNĐ</option>
      <option value="200000">200.000 VNĐ</option>
      <option value="500000">500.000 VNĐ</option>
    </select>

    <label>Mã thẻ demo</label>
    <input
      type="text"
      id="card"
      placeholder="Nhập mã demo"
    >

    <button onclick="napThe()">
      NẠP THẺ
    </button>

    <div id="message"></div>

    <div class="note">
      Đây là website demo để học HTML/CSS/JavaScript.
      Không sử dụng để thu thập hoặc xử lý mã thẻ thật.
    </div>

  </div>

  <script>
    function napThe() {

      const userId = document.getElementById("userId").value;
      const amount = document.getElementById("amount").value;
      const card = document.getElementById("card").value;
      const message = document.getElementById("message");

      if (userId === "" || amount === "" || card === "") {
        message.style.color = "red";
        message.innerText = "Vui lòng nhập đầy đủ thông tin!";
        return;
      }

      message.style.color = "green";
      message.innerText =
        "Demo thành công! Đây không phải giao dịch nạp thẻ thật.";
    }
  </script>

</body>
  </html>
